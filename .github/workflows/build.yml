name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest -v

  app:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew bundle
      - name: Build the app
        # A tag names the version, with the v that tags carry taken off.
        run: VERSION="${VERSION#v}" ./make-app.sh
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
      - name: Check the bundle
        run: |
          codesign --verify --strict Haldor.app
          test -d Haldor.app/Contents/Resources/bepinex-arm64/core
          test -s Haldor.app/Contents/Resources/certs/cacert.pem
          test -n "$(ls Haldor.app/Contents/Resources/shaderfix/*.txt)"
      - name: Pack it
        # ditto keeps the bundle's symlinks and extended attributes, zip does not.
        run: ditto -c -k --keepParent Haldor.app Haldor.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Haldor
          path: Haldor.zip

  release:
    needs: app
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Haldor
      - run: gh release create "$GITHUB_REF_NAME" Haldor.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
